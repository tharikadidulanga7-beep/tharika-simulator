<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FS-310E CUT SIMULATOR — Made by Tharika Didulanga</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0e1525;
      --card-2: #131c31;
      --border: #1e2d4a;
      --text: #e6edf7;
      --muted: #8fa2c2;
      --green: #10b981;
      --blue: #2563eb;
      --red: #7f1d1d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Lock / Login Screen */
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #13203a, #060911 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 9999;
    }

    .lock-box {
      width: 100%;
      max-width: 370px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .lock-box h2 { font-size: 1.1rem; color: #fff; margin-bottom: 4px; }
    .lock-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; }
    .input-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .input-group input:focus { outline: none; border-color: #38bdf8; }

    .unlock-btn {
      width: 100%;
      background: var(--green);
      color: #03261a;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .lock-err {
      color: #fca5a5;
      font-size: 0.78rem;
      min-height: 18px;
      margin-top: 9px;
    }

    /* Simulator Container */
    #simApp {
      display: none;
      max-width: 540px;
      margin: 0 auto;
      padding: 12px;
    }

    .header-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .brand-title { font-size: 1rem; font-weight: 800; letter-spacing: 0.4px; color: #fff; line-height: 1.25; }
    .brand-sub { font-size: 0.76rem; color: var(--muted); margin-top: 3px; }

    .made-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .lock-btn {
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fecaca;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--muted);
      padding: 4px 2px 10px;
    }

    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .step-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .step-num { color: #38bdf8; font-weight: 700; }
    .step-live { color: var(--muted); font-size: 0.74rem; }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .step-field label {
      display: block;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 5px;
      line-height: 1.25;
    }

    .step-field input {
      width: 100%;
      text-align: center;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 8px 6px;
      border-radius: 8px;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-sample {
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #93c5fd;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn-reset {
      background: rgba(127, 29, 29, 0.32);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="lockOverlay">
    <form class="lock-box" id="lockForm">
      <h2>FS-310E Simulator Lock</h2>
      <p>Web එකෙන් අයින් වුණාම auto lock වෙයි. Enter වෙන්න Username &amp; Password දෙන්න.</p>
      <div class="input-group">
        <label for="authUser">Username</label>
        <input id="authUser" type="text" autocomplete="off" required />
      </div>
      <div class="input-group">
        <label for="authPass">Password</label>
        <input id="authPass" type="password" autocomplete="off" required />
      </div>
      <button type="submit" class="unlock-btn">Unlock</button>
      <div class="lock-err" id="lockErr"></div>
    </form>
  </div>

  <div id="simApp">
    <div class="header-card">
      <div>
        <div class="brand-title">FS-310E CUT<br/>SIMULATOR</div>
        <div class="brand-sub">True-Scale 2D Profile<br/>Cut Engine</div>
        <div class="made-badge">Made by Tharika Didulanga</div>
      </div>
      <button type="button" class="lock-btn" id="manualLockBtn" title="Lock Now">
        <span>🔒</span>
        <span>Lock</span>
      </button>
    </div>

    <div class="meta-row">
      <span>Datum: 0.0 mm (Bottom)</span>
      <span>Scale: 3.0 px = 1.0 mm</span>
    </div>

    <div id="stepsContainer"></div>

    <div class="bottom-actions">
      <button type="button" class="btn-sample" id="sampleBtn">Sample 3mm Cut</button>
      <button type="button" class="btn-reset" id="resetBtn">Reset All</button>
    </div>
  </div>

  <script>
    const VALID_USER = "Tharikaphython";
    const VALID_PASS = "20041005";

    const lockOverlay = document.getElementById("lockOverlay");
    const simApp = document.getElementById("simApp");
    const lockForm = document.getElementById("lockForm");
    const lockErr = document.getElementById("lockErr");

    let unlockedThisVisit = false;

    function lockSimulator(message = "") {
      unlockedThisVisit = false;
      simApp.style.display = "none";
      lockOverlay.style.display = "flex";
      if (message) lockErr.textContent = message;
    }

    function unlockSimulator() {
      unlockedThisVisit = true;
      lockErr.textContent = "";
      document.getElementById("authUser").value = "";
      document.getElementById("authPass").value = "";
      lockOverlay.style.display = "none";
      simApp.style.display = "block";
    }

    lockForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("authUser").value.trim();
      const p = document.getElementById("authPass").value;
      if (u === VALID_USER && p === VALID_PASS) {
        unlockSimulator();
      } else {
        lockErr.textContent = "Username හෝ Password වැරදියි.";
      }
    });

    document.getElementById("manualLockBtn").addEventListener("click", () => {
      lockSimulator("Simulator locked.");
    });

    // Leave tab / switch app / minimize -> auto lock so returning requires login
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && unlockedThisVisit) {
        lockSimulator("Web එකෙන් අයින් වූ බැවින් auto lock විය. නැවත login වන්න.");
      }
    });

    window.addEventListener("pagehide", () => {
      if (unlockedThisVisit) {
        lockSimulator();
      }
    });

    // Steps data (4 steps as shown)
    let steps = [
      { h: 0, w: 0, d: 0 },
      { h: 0, w: 0, d: 0 },
      { h: 0, w: 0, d: 0 },
      { h: 0, w: 0, d: 0 }
    ];

    const stepsContainer = document.getElementById("stepsContainer");

    function renderSteps() {
      stepsContainer.innerHTML = "";
      steps.forEach((st, i) => {
        const card = document.createElement("div");
        card.className = "step-card";
        card.innerHTML = `
          <div class="step-head">
            <span class="step-num">Step #${i + 1}</span>
            <span class="step-live" id="live-${i}">H:${Number(st.h).toFixed(1)} | W:${Number(st.w).toFixed(1)} | D:${Number(st.d).toFixed(1)}mm</span>
          </div>
          <div class="step-grid">
            <div class="step-field">
              <label>Starting Height<br/>(mm)</label>
              <input type="number" step="0.1" value="${st.h}" data-idx="${i}" data-key="h" />
            </div>
            <div class="step-field">
              <label>Slot Width (mm)</label>
              <input type="number" step="0.1" value="${st.w}" data-idx="${i}" data-key="w" />
            </div>
            <div class="step-field">
              <label>Profundity (mm)</label>
              <input type="number" step="0.1" value="${st.d}" data-idx="${i}" data-key="d" />
            </div>
          </div>
        `;
        stepsContainer.appendChild(card);
      });
    }

    stepsContainer.addEventListener("input", (e) => {
      const el = e.target;
      const idx = Number(el.dataset.idx);
      const key = el.dataset.key;
      if (Number.isNaN(idx) || !key) return;
      steps[idx][key] = Number(el.value) || 0;
      const liveEl = document.getElementById(`live-${idx}`);
      if (liveEl) {
        liveEl.textContent = `H:${steps[idx].h.toFixed(1)} | W:${steps[idx].w.toFixed(1)} | D:${steps[idx].d.toFixed(1)}mm`;
      }
    });

    document.getElementById("sampleBtn").addEventListener("click", () => {
      steps = [
        { h: 15, w: 12, d: 3 },
        { h: 35, w: 12, d: 3 },
        { h: 55, w: 12, d: 3 },
        { h: 75, w: 12, d: 3 }
      ];
      renderSteps();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      steps = [
        { h: 0, w: 0, d: 0 },
        { h: 0, w: 0, d: 0 },
        { h: 0, w: 0, d: 0 },
        { h: 0, w: 0, d: 0 }
      ];
      renderSteps();
    });

    renderSteps();
    lockSimulator();
  </script>
</body>
</html>
